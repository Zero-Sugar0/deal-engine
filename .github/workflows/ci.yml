name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: ./node_modules/.bin/tsc -p packages/core/tsconfig.json
      - run: ./node_modules/.bin/tsc -p packages/policy/tsconfig.json
      - run: ./node_modules/.bin/tsc -p packages/memory/tsconfig.json
      - run: ./node_modules/.bin/tsc -p packages/sdk-ts/tsconfig.json
      - run: ./node_modules/.bin/tsc -p packages/evals/tsconfig.json
      - run: ./node_modules/.bin/tsc -p apps/api/tsconfig.json
      - run: ./node_modules/.bin/tsc -p apps/mcp/tsconfig.json
      - run: (cd apps/dashboard && ../../node_modules/.bin/vite build)
      - run: ./node_modules/.bin/vitest run
      - run: python -m compileall packages/sdk-python/deal_sdk
